<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1018" viewBox="0 0 720 1018" role="img" aria-labelledby="title desc"><title id="title">语义契约、知识组织、检索推理三层架构</title><desc id="desc">L1用领域模式和本体定义语义；L2用文档图表树和Wiki组织证据；L3路由检索推理并生成引用；治理和缓存横向支持。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="1016" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="49" font-size="34" fill="#122e43" font-weight="700"><tspan x="32" dy="0">知识库技术的三个层级</tspan></text><text x="32" y="92" font-size="24" fill="#547080" font-weight="400"><tspan x="32" dy="0">先定义含义，再组织证据，最后按问题取证</tspan></text><rect x="32" y="127" width="656" height="158" rx="14" fill="#f0eafb" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="165" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">L1 · 语义契约：知识是什么意思</tspan></text><text x="54" y="208" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">领域词表、Schema、Ontology / TBox</tspan><tspan x="54" dy="40.5">类型与公理；可选 Reasoner / SHACL</tspan></text><path d="M360 289 L360 327" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><text x="393" y="316" font-size="21" fill="#547080" font-weight="400"><tspan x="393" dy="0">定义与约束</tspan></text><rect x="32" y="340" width="656" height="216" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="379" font-size="27" fill="#12486b" font-weight="700"><tspan x="54" dy="0">L2 · 知识组织：证据怎样保存</tspan></text><text x="54" y="425" font-size="26" fill="#20384d" font-weight="400"><tspan x="54" dy="0">文档 / Chunk · 全文索引 / SQLite FTS5</tspan><tspan x="54" dy="39">知识图谱 / ABox · SQL 表与结构化事实</tspan><tspan x="54" dy="39">PageIndex 章节树 · LLM-Wiki 概念页</tspan></text><path d="M360 560 L360 598" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><text x="393" y="587" font-size="21" fill="#547080" font-weight="400"><tspan x="393" dy="0">授权与版本过滤</tspan></text><rect x="32" y="611" width="656" height="219" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="651" font-size="27" fill="#1b5140" font-weight="700"><tspan x="54" dy="0">L3 · 检索推理：如何得到有据答案</tspan></text><text x="54" y="697" font-size="26" fill="#20384d" font-weight="400"><tspan x="54" dy="0">Router → Dense / BM25 / Graph / SQL</tspan><tspan x="54" dy="39">树 / Wiki 搜索 → KAG / 在线扩展</tspan><tspan x="54" dy="39">融合重排 → 上下文 → 生成与引用校验</tspan></text><rect x="32" y="864" width="656" height="122" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="906" font-size="25" fill="#20384d" font-weight="400"><tspan x="54" dy="0">横向治理：来源、权限、版本、生命周期</tspan><tspan x="54" dy="37.5">执行复用：CAG / Prompt Cache / KV Cache</tspan></text></g></svg>
