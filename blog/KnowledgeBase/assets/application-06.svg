<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">LLM-Wiki 应用：产品别名与政策换版</title><desc id="desc">源文档变动驱动别名和退款概念页更新，查询按有效版本回源。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 06 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">让知识页跟着政策版本更新</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：产品改名后，退款规则是哪版？</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 原始资料变化</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">产品名称变更说明 + 新退款政策</tspan><tspan x="54" dy="40.5">旧文档保留历史，不冒充现行规则</tspan></text><path d="M360 317 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="398" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 更新概念页与来源依赖</tspan></text><text x="54" y="441" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">规范名称 ← 旧名别名</tspan><tspan x="54" dy="40.5">退款概念页 ← 生效版本与原文条款</tspan></text><path d="M360 503 L360 535" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="545" width="656" height="140" rx="14" fill="#e6f3ed" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="583" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">③ 查询时按版本选择</tspan></text><text x="54" y="626" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">旧名称查询也定位到规范概念</tspan><tspan x="54" dy="40.5">冲突未解决的页进入待审核状态</tspan></text><text x="38" y="776" font-size="24" fill="#547080" font-weight="400"><tspan x="38" dy="0">可复用的是经过组织且可回源的知识。</tspan><tspan x="38" dy="36">改动、删除和失效必须传播到派生页面。</tspan></text></g></svg>
