<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">KAG 应用：条件通知求解</title><desc id="desc">匹配预案与事件事实，先输出组10指挥中心，再输出组20两家单位；组内先后未定义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 03 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">把条件和顺序变成可核对结果</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">输入：北段、一级事故、有人受伤</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 选择有效预案 P1</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">规则 R1：一级 → 指挥中心，组 10</tspan><tspan x="54" dy="40.5">规则 R2 / R3：一级且受伤 → 组 20</tspan></text><path d="M360 317 L360 350" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="398" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 匹配条件并保留规则来源</tspan></text><text x="54" y="441" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">核对区域、版本、等级和受伤条件</tspan><tspan x="54" dy="40.5">未知条件不按 true 或 false 猜测</tspan></text><path d="M360 502 L360 535" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="545" width="656" height="140" rx="14" fill="#e6f3ed" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="583" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">③ 按明确的顺序组输出</tspan></text><text x="54" y="626" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">组 10：指挥中心</tspan><tspan x="54" dy="40.5">组 20：高速交警、医疗救援</tspan></text><rect x="32" y="712" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="751" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">组 20 内没有规定先后</tspan><tspan x="54" dy="40.5">查询通知计划不等于执行通知</tspan></text></g></svg>
