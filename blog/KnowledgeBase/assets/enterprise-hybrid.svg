<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1074" viewBox="0 0 720 1074" role="img" aria-labelledby="title desc"><title id="title">企业混合知识库完整数据流</title><desc id="desc">原始资料解析后进入向量全文图树Wiki和SQL分支，身份路由按需选工具，经去重重排和生成引用；语义权限版本来源贯穿全程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="1072" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="49" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">企业混合知识库：分支按需启用</tspan></text><text x="32" y="91" font-size="24" fill="#547080" font-weight="400"><tspan x="32" dy="0">共享解析与追溯底座，每问选择必要的工具</tspan></text><rect x="32" y="127" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="165" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 原始资料与解析</tspan></text><text x="54" y="208" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">原始对象存储 → 解析 / OCR / 清洗</tspan><tspan x="54" dy="40.5">保存页码、版本、权限和来源映射</tspan></text><text x="42" y="310" font-size="25" fill="#604185" font-weight="600"><tspan x="42" dy="0">语义约束：Ontology / Schema / 业务口径</tspan></text><path d="M360 330 L360 360" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="370" width="656" height="203" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="410" font-size="27" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 并列的索引与知识表示</tspan></text><rect x="49" y="433" width="200" height="51" rx="9" fill="#ffffff" stroke="#bacbd8" stroke-width="2"/><text x="60" y="467" font-size="23" fill="#20384d" font-weight="400"><tspan x="60" dy="0">向量索引</tspan></text><rect x="259" y="433" width="200" height="51" rx="9" fill="#ffffff" stroke="#bacbd8" stroke-width="2"/><text x="270" y="467" font-size="23" fill="#20384d" font-weight="400"><tspan x="270" dy="0">BM25 / FTS5</tspan></text><rect x="469" y="433" width="200" height="51" rx="9" fill="#ffffff" stroke="#bacbd8" stroke-width="2"/><text x="480" y="467" font-size="23" fill="#20384d" font-weight="400"><tspan x="480" dy="0">知识图谱</tspan></text><rect x="49" y="497" width="200" height="51" rx="9" fill="#ffffff" stroke="#bacbd8" stroke-width="2"/><text x="60" y="531" font-size="23" fill="#20384d" font-weight="400"><tspan x="60" dy="0">PageIndex</tspan></text><rect x="259" y="497" width="200" height="51" rx="9" fill="#ffffff" stroke="#bacbd8" stroke-width="2"/><text x="270" y="531" font-size="23" fill="#20384d" font-weight="400"><tspan x="270" dy="0">LLM-Wiki</tspan></text><rect x="469" y="497" width="200" height="51" rx="9" fill="#ffffff" stroke="#bacbd8" stroke-width="2"/><text x="480" y="531" font-size="23" fill="#20384d" font-weight="400"><tspan x="480" dy="0">SQL / API</tspan></text><path d="M360 577 L360 610" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="623" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="661" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">③ 身份与 Agent Router</tspan></text><text x="54" y="704" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">按问题选择工具；规则 / KAG 按需求解</tspan><tspan x="54" dy="40.5">有界调用 → 授权复验 → 来源去重</tspan></text><path d="M360 767 L360 800" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="813" width="656" height="140" rx="14" fill="#e6f3ed" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="851" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">④ 重排、上下文与 LLM</tspan></text><text x="54" y="894" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">证据覆盖检查 → 生成 → 引用验证</tspan><tspan x="54" dy="40.5">缓存仅复用有效的授权上下文</tspan></text><text x="38" y="1003" font-size="24" fill="#547080" font-weight="400"><tspan x="38" dy="0">全链路：原文追溯 · 权限隔离 · 版本发布</tspan><tspan x="38" dy="36">来源相同的 Chunk、图边、Wiki 不重复算证据</tspan></text></g></svg>
