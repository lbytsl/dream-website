<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">CAG 应用：固定手册缓存与版本失效</title><desc id="desc">不同问题共享授权手册前缀；答案仍分别生成，换版和撤权必须阻断旧版本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 10 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">复用手册前缀，不复用旧答案</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">场景：多次询问同一版本产品手册</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 组成固定授权前缀</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">规则 + 产品手册 v3 + 来源位置</tspan><tspan x="54" dy="40.5">绑定模型、文档和权限版本</tspan></text><path d="M360 317 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="398" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 相同前缀，不同问题</tspan></text><text x="54" y="441" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">固定前缀 + 问题 A → 答案 A</tspan><tspan x="54" dy="40.5">固定前缀 + 问题 B → 答案 B</tspan></text><path d="M360 503 L360 535" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="545" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="584" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">③ 命中时复用部分推理状态</tspan><tspan x="54" dy="40.5">每次仍要生成答案并校验引用</tspan></text><rect x="32" y="690" width="656" height="122" rx="14" fill="#fff2de" stroke="#ddc08f" stroke-width="2"/><text x="54" y="732" font-size="26" fill="#755223" font-weight="400"><tspan x="54" dy="0">换为 v4 或撤权：阻断旧版本复用</tspan><tspan x="54" dy="39">后端未命中：回源重建或走 RAG</tspan></text></g></svg>
