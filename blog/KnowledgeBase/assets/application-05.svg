<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">PageIndex 应用：跨章节合同取证</title><desc id="desc">先选择合同章节，再回读第8页交付、第17页验收和第23页尾款原文，确认验收单和合规发票两个条件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 05 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">跨章节读完一条合同条件</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：交付后还要满足什么付款条件？</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 锁定合同与目录节点</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">同一份有效合同、同一版本</tspan><tspan x="54" dy="40.5">先读目录和章节摘要，不直接作答</tspan></text><path d="M360 317 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="194" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="400" font-size="26" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 读取原文页与交叉引用</tspan></text><text x="64" y="446" font-size="26" fill="#20384d" font-weight="400"><tspan x="64" dy="0">第 8 页交付 → 第 17 页验收</tspan><tspan x="64" dy="39">验收单 + 合规发票 → 第 23 页尾款</tspan></text><path d="M360 557 L360 588" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="600" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="639" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">③ 回答：验收单和合规发票齐备</tspan><tspan x="54" dy="40.5">原文未给出付款期限，不自行补写</tspan></text><text x="38" y="780" font-size="23" fill="#547080" font-weight="400"><tspan x="38" dy="0">不能把目录摘要当合同全文。</tspan><tspan x="38" dy="34.5">本图仅说明读法，具体条款见下方虚构数据。</tspan></text></g></svg>
