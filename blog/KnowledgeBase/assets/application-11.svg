<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">混合知识库应用：应急问题的证据组合</title><desc id="desc">按问题拆分章节、规则和实时值班查询，再统一来源并验证覆盖，非全部工具串行调用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 11 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">按子问题组合最小工具集合</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：事故后通知谁、顺序和职责是什么？</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 确认输入和资料版本</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">虚构北段预案 P1、一级、有人受伤</tspan><tspan x="54" dy="40.5">当前值班信息来自独立业务快照</tspan></text><path d="M360 317 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="194" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="400" font-size="26" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 按证据类型分工</tspan></text><text x="54" y="445" font-size="26" fill="#20384d" font-weight="400"><tspan x="54" dy="0">章节树：预案条款与职责</tspan><tspan x="54" dy="39">规则求解：明确的条件和顺序组</tspan><tspan x="54" dy="39">SQL：值班状态；混合检索补充原文</tspan></text><path d="M360 557 L360 588" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="600" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="639" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">③ 去重并按子问题检查覆盖</tspan><tspan x="54" dy="40.5">答案逐条引用；缺失条件单独说明</tspan></text><text x="38" y="781" font-size="23" fill="#547080" font-weight="400"><tspan x="38" dy="0">同一条款的多个派生物只算一份来源。</tspan><tspan x="38" dy="34.5">先验证简单基线，再增加图、Wiki 或 Agent。</tspan></text></g></svg>
