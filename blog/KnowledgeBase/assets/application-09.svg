<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">Agentic RAG 应用：跨数据源故障调查</title><desc id="desc">按计划调用监控、变更和手册工具，检查证据缺口并有界停止，不把时间相关当根因。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 09 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">按证据缺口选择下一种工具</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：09:42 的故障是否由变更引起？</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 收集事实与时间</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">09:40：SQL 查到一次配置变更</tspan><tspan x="54" dy="40.5">09:42：监控出现异常</tspan></text><path d="M360 317 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="398" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 规划 → 调用 → 检查</tspan></text><text x="54" y="441" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">查监控、变更记录、运行手册</tspan><tspan x="54" dy="40.5">缺证据时换工具；达到预算停止</tspan></text><path d="M360 503 L360 535" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="545" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="584" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">③ 输出已知事实与未证实假设</tspan><tspan x="54" dy="40.5">为下一步人工检查提供来源</tspan></text><rect x="32" y="690" width="656" height="122" rx="14" fill="#fff2de" stroke="#ddc08f" stroke-width="2"/><text x="54" y="733" font-size="26" fill="#755223" font-weight="400"><tspan x="54" dy="0">时间接近不足以证明根因</tspan><tspan x="54" dy="39">问答工具不自动执行变更或回滚</tspan></text></g></svg>
