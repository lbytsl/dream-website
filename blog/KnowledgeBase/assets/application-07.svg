<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">Ontology 应用：资源类型推理</title><desc id="desc">由救援车是应急车辆子类和vehicle-01是救援车推出分类；vehicle-02只声明为车辆，其余类型未知。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 07 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">从类型公理推出资源分类</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：台账中有哪些应急车辆？</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#f0eafb" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① TBox：定义类型关系</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">救援车 ⊆ 应急车辆 ⊆ 车辆</tspan><tspan x="54" dy="40.5">明确领域类、属性与公理</tspan></text><path d="M360 317 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="398" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② ABox：登记实例事实</tspan></text><text x="54" y="441" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">vehicle-01 是救援车</tspan><tspan x="54" dy="40.5">vehicle-02 只声明为车辆</tspan></text><path d="M360 503 L360 535" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="545" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="584" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">③ 可推出：vehicle-01 是应急车辆</tspan><tspan x="54" dy="40.5">推理开启或物化后，可查询该分类</tspan></text><rect x="32" y="690" width="656" height="122" rx="14" fill="#fff2de" stroke="#ddc08f" stroke-width="2"/><text x="54" y="732" font-size="26" fill="#755223" font-weight="400"><tspan x="54" dy="0">未查到 vehicle-02，不证明它不属于</tspan><tspan x="54" dy="39">应急车辆；也不能推断两车当前可用</tspan></text></g></svg>
