<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">GraphRAG 应用：两层依赖影响范围</title><desc id="desc">从库存数据库沿依赖反方向找到库存服务和订单API；支付API超过两跳。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 02 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">沿依赖关系查找潜在影响</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：库存数据库变更，两层内影响谁？</tspan></text><rect x="32" y="177" width="656" height="117" rx="14" fill="#fff2de" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="219" font-size="29" fill="#20384d" font-weight="700"><tspan x="54" dy="0">起点：库存数据库</tspan></text><text x="54" y="262" font-size="23" fill="#20384d" font-weight="400"><tspan x="54" dy="0">变更对象</tspan></text><rect x="32" y="337" width="656" height="117" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="379" font-size="29" fill="#20384d" font-weight="700"><tspan x="54" dy="0">第 1 跳：库存服务</tspan></text><text x="54" y="422" font-size="23" fill="#20384d" font-weight="400"><tspan x="54" dy="0">库存服务 depends_on 库存数据库</tspan></text><rect x="32" y="497" width="656" height="117" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="539" font-size="29" fill="#20384d" font-weight="700"><tspan x="54" dy="0">第 2 跳：订单 API</tspan></text><text x="54" y="582" font-size="23" fill="#20384d" font-weight="400"><tspan x="54" dy="0">订单 API depends_on 库存服务</tspan></text><path d="M360 297 L360 327" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M360 457 L360 487" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><text x="430" y="321" font-size="21" fill="#547080" font-weight="400"><tspan x="430" dy="0">反向查找</tspan></text><text x="430" y="481" font-size="21" fill="#547080" font-weight="400"><tspan x="430" dy="0">反向查找</tspan></text><rect x="32" y="660" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="699" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">输出：库存服务、订单 API + 路径</tspan><tspan x="54" dy="40.5">支付 API 在第 3 跳，本题排除</tspan></text><text x="38" y="817" font-size="23" fill="#7a4e18" font-weight="400"><tspan x="38" dy="0">路径表示潜在影响，不能直接证明故障因果。</tspan></text></g></svg>
