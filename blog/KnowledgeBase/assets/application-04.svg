<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">SQL 知识库应用：待办工单统计</title><desc id="desc">将业务口径映射为SQL，得到网络组2件、账号组1件、桌面组0件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 04 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">把“待办”变成明确的统计口径</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：各服务台小组还有多少待办？</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① Schema Linking</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">小组 → team；工单 → ticket</tspan><tspan x="54" dy="40.5">待办 → 待处理、处理中</tspan></text><path d="M360 318 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="398" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 受控 SQL 执行</tspan></text><text x="54" y="441" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">LEFT JOIN + 参数化状态条件</tspan><tspan x="54" dy="40.5">按小组 COUNT(ticket.id)</tspan></text><path d="M360 503 L360 533" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="545" width="656" height="197" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="587" font-size="26" fill="#12486b" font-weight="700"><tspan x="54" dy="0">③ 查询结果</tspan></text><text x="64" y="628" font-size="28" fill="#20384d" font-weight="400"><tspan x="64" dy="0">网络组</tspan></text><text x="590" y="628" font-size="28" fill="#1b5140" font-weight="700"><tspan x="590" dy="0">2</tspan></text><text x="64" y="671" font-size="28" fill="#20384d" font-weight="400"><tspan x="64" dy="0">账号组</tspan></text><text x="590" y="671" font-size="28" fill="#1b5140" font-weight="700"><tspan x="590" dy="0">1</tspan></text><text x="64" y="714" font-size="28" fill="#20384d" font-weight="400"><tspan x="64" dy="0">桌面组</tspan></text><text x="590" y="714" font-size="28" fill="#1b5140" font-weight="700"><tspan x="590" dy="0">0</tspan></text><text x="38" y="809" font-size="23" fill="#547080" font-weight="400"><tspan x="38" dy="0">保留零值小组；生产查询同时限定授权数据范围。</tspan></text></g></svg>
