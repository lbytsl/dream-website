<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">文档 RAG 应用：错误码混合检索</title><desc id="desc">从手册条款经全文和向量召回、融合重排到带出处的恢复步骤。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 01 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">把错误码和问题含义一起检索</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：DREAM-407 后怎样恢复访问？</tspan></text><rect x="32" y="170" width="656" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="208" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① 原始条款</tspan></text><text x="54" y="251" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">A：账号权限检查</tspan><tspan x="54" dy="40.5">B：权限生效后退出并重新登录</tspan></text><path d="M360 312 L360 341" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="350" width="316" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="390" font-size="27" fill="#12486b" font-weight="700"><tspan x="54" dy="0">全文召回</tspan></text><text x="54" y="442" font-size="29" fill="#20384d" font-weight="400"><tspan x="54" dy="0">A → C → B</tspan></text><rect x="372" y="350" width="316" height="140" rx="14" fill="#f0eafb" stroke="#c8d6e1" stroke-width="2"/><text x="394" y="390" font-size="27" fill="#604185" font-weight="700"><tspan x="394" dy="0">向量召回</tspan></text><text x="394" y="442" font-size="29" fill="#20384d" font-weight="400"><tspan x="394" dy="0">B → A</tspan></text><path d="M190 493 L280 528" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M530 493 L440 528" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="540" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="578" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② RRF 融合 + 重排</tspan></text><text x="54" y="621" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">A、B 进入上下文；C 降序或剔除</tspan><tspan x="54" dy="40.5">保留手册版本与章节定位</tspan></text><rect x="32" y="706" width="656" height="110" rx="14" fill="#e6f3ed" stroke="#9bc8b1" stroke-width="2"/><text x="54" y="745" font-size="27" fill="#1b5140" font-weight="600"><tspan x="54" dy="0">③ 回答：检查权限，再重新登录</tspan><tspan x="54" dy="40.5">每个步骤分别引用条款 A、B</tspan></text></g></svg>
