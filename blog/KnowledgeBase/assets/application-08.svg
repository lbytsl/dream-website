<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">SAG2 相关应用：词法检索与在线证据扩展</title><desc id="desc">全文索引先召回，查询时判断缺失信息并扩展术语，形成带来源的证据链。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65869b"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="718" height="848" rx="20" fill="#f4f8fb" stroke="#d7e3eb" stroke-width="2"/><text x="32" y="43" font-size="20" fill="#547080" font-weight="400"><tspan x="32" dy="0">应用图 08 · 虚构教学示例</tspan></text><text x="32" y="92" font-size="33" fill="#122e43" font-weight="700"><tspan x="32" dy="0">把关联扩展留到提问之后</tspan></text><text x="32" y="139" font-size="25" fill="#476071" font-weight="400"><tspan x="32" dy="0">问题：网关 403 后怎样找到处理步骤？</tspan></text><rect x="32" y="175" width="656" height="140" rx="14" fill="#ffffff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="213" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">① FTS5 / BM25 初次召回</tspan></text><text x="54" y="256" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">先匹配问题中明确出现的词</tspan><tspan x="54" dy="40.5">保留片段 ID、版本与原文位置</tspan></text><path d="M360 317 L360 349" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="360" width="656" height="140" rx="14" fill="#e7f0ff" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="398" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">② 在线判断证据缺口</tspan></text><text x="54" y="441" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">从命中片段发现关联术语</tspan><tspan x="54" dy="40.5">带着新线索继续检索和核对</tspan></text><path d="M360 503 L360 535" stroke="#65869b" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="545" width="656" height="140" rx="14" fill="#e6f3ed" stroke="#c8d6e1" stroke-width="2"/><text x="54" y="583" font-size="25" fill="#12486b" font-weight="700"><tspan x="54" dy="0">③ 形成有边界的证据链</tspan></text><text x="54" y="626" font-size="27" fill="#20384d" font-weight="400"><tspan x="54" dy="0">令牌变更 ↔ 网关权限与错误说明</tspan><tspan x="54" dy="40.5">达到覆盖目标或预算后停止</tspan></text><text x="38" y="776" font-size="23" fill="#547080" font-weight="400"><tspan x="38" dy="0">这是教学搜索轨迹，不是论文源码复现。</tspan><tspan x="38" dy="34.5">中文全文索引需明确分词，关联不等于因果。</tspan></text></g></svg>
