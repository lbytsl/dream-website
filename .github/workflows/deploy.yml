name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # 每天北京时间 08:23 同步统计并重新部署，无需修改文档中的数字。
  schedule:
    - cron: '23 0 * * *'

# 同一时间只保留一个 Pages 部署。
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 外部统计读取失败时沿用上次成功部署的快照，缓存中不包含任何凭据。
      - name: Restore skill statistics
        uses: actions/cache/restore@v4
        with:
          path: static/data/skill-stats.json
          key: skill-stats-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: skill-stats-

      - name: Build website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save skill statistics
        uses: actions/cache/save@v4
        with:
          path: static/data/skill-stats.json
          key: skill-stats-${{ github.run_id }}-${{ github.run_attempt }}
